name: Build Meta Quest 2 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-quest-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 21 for Android Gradle
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies & Build Web Bundle
        run: |
          npm ci
          npm run build

      - name: Generate Meta Quest 2 Immersive WebXR TWA Project (@meta-quest/bubblewrap-core)
        env:
          QUEST_KEYSTORE_B64: ${{ secrets.QUEST_KEYSTORE_B64 }}
          QUEST_KEYSTORE_PASSWORD: ${{ secrets.QUEST_KEYSTORE_PASSWORD }}
        run: |
          npm install --no-save @meta-quest/bubblewrap-core jimp@0.22.7
          node - << 'EOF'
          const fs = require('fs');
          const path = require('path');
          const Jimp = require('jimp');
          const { TwaManifest, TwaGenerator, ConsoleLog } = require('@meta-quest/bubblewrap-core');

          async function generate() {
            const manifest = new TwaManifest({
              packageId: 'com.techcom.terminatorsurvivors',
              host: 'terminator-survivors.vercel.app',
              name: 'Terminator Survivors 2029',
              launcherName: 'T-Survivors',
              display: 'fullscreen',
              themeColor: '#0a0303',
              themeColorDark: '#000000',
              navigationColor: '#000000',
              navigationColorDark: '#000000',
              navigationDividerColor: '#000000',
              navigationDividerColorDark: '#000000',
              backgroundColor: '#0a0303',
              enableNotifications: false,
              enableSiteSettingsShortcut: false,
              startUrl: '/?vr=1',
              iconUrl: 'https://terminator-survivors.vercel.app/icons/icon-512.png',
              maskableIconUrl: 'https://terminator-survivors.vercel.app/icons/icon-maskable-512.png',
              splashScreenFadeOutDuration: 300,
              appVersion: '1.10.0',
              appVersionCode: 3,
              signingKey: { path: './android.keystore', alias: 'androiddebugkey' },
              fallbackType: 'customtabs',
              isMetaQuest: true,
              horizonOSAppMode: 'immersive',
              orientation: 'landscape',
              minSdkVersion: 29
            });

            const generator = new TwaGenerator();
            const localIconPath = path.resolve('public/icons/icon-512.png');
            generator.imageHelper.fetchIcon = async (url) => ({
              url,
              data: await Jimp.read(localIconPath)
            });

            const outDir = path.resolve('android-quest');
            await generator.createTwaProject(outDir, manifest, new ConsoleLog());

            // 1. Ensure mavenCentral() is present in root build.gradle for com.meta.androidbrowserhelper:2.5.0
            const rootGradlePath = path.join(outDir, 'build.gradle');
            let rootGradle = fs.readFileSync(rootGradlePath, 'utf8');
            rootGradle = rootGradle.replace(/google\(\)/g, 'google()\n        mavenCentral()');
            fs.writeFileSync(rootGradlePath, rootGradle, 'utf8');

            // 2. Inject com.oculus.supportedDevices and INTERNET permission into AndroidManifest.xml
            const manifestXmlPath = path.join(outDir, 'app/src/main/AndroidManifest.xml');
            let manifestXml = fs.readFileSync(manifestXmlPath, 'utf8');
            manifestXml = manifestXml.replace(
              '<uses-permission android:name="com.oculus.permission.HAND_TRACKING" />',
              '<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="com.oculus.permission.HAND_TRACKING" />'
            );
            manifestXml = manifestXml.replace(
              '<meta-data\n                android:name="com.oculus.ossplash.background"',
              '<meta-data\n                android:name="com.oculus.supportedDevices"\n                android:value="quest2|questpro|quest3|quest3s" />\n             <meta-data\n                android:name="com.oculus.ossplash.background"'
            );
            fs.writeFileSync(manifestXmlPath, manifestXml, 'utf8');

            // 3. Write the signing keystore (from repository secrets) matching public/.well-known/assetlinks.json
            const keystoreB64 = process.env.QUEST_KEYSTORE_B64;
            const keystorePassword = process.env.QUEST_KEYSTORE_PASSWORD;
            if (!keystoreB64 || !keystorePassword) throw new Error('QUEST_KEYSTORE_B64 and QUEST_KEYSTORE_PASSWORD secrets are required');
            fs.writeFileSync(path.join(outDir, 'app/quest-sideload.p12'), Buffer.from(keystoreB64, 'base64'));

            const appGradlePath = path.join(outDir, 'app/build.gradle');
            let appGradle = fs.readFileSync(appGradlePath, 'utf8');
            appGradle = appGradle.replace(
              'buildTypes {',
              [
                'signingConfigs {',
                '        questSideload {',
                '            storeFile file("quest-sideload.p12")',
                `            storePassword "${keystorePassword}"`,
                '            keyAlias "androiddebugkey"',
                `            keyPassword "${keystorePassword}"`,
                '        }',
                '    }',
                '    buildTypes {',
                '        debug {',
                '            signingConfig signingConfigs.questSideload',
                '        }'
              ].join('\n')
            );
            fs.writeFileSync(appGradlePath, appGradle, 'utf8');
            console.log('Meta Quest 2 Immersive WebXR TWA project generated successfully.');
          }

          generate().catch((err) => {
            console.error(err);
            process.exit(1);
          });
          EOF

      - name: Build Sideloadable APK (Signed for Quest 2 Unknown Sources & Digital Asset Links)
        working-directory: android-quest
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../terminator-survivors-quest2.apk

      - name: Upload Quest 2 APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: terminator-survivors-quest2-apk
          path: terminator-survivors-quest2.apk
          retention-days: 30

      - name: Publish Latest Quest 2 APK Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: quest2-latest
          name: "Meta Quest 2 Sideload APK (Latest 3D WebXR Build)"
          body: |
            ### Meta Quest 2 Native 3D WebXR Sideload APK (`terminator-survivors-quest2.apk`)
            Built with **`@meta-quest/bubblewrap-core`** (`com.meta.androidbrowserhelper:2.5.0`, `horizonOSAppMode: "immersive"`, `com.oculus.browser.WebXRCustomTabActivity`).
            - **Install via SideQuest:** Drag and drop `terminator-survivors-quest2.apk` into SideQuest.
            - **Install via ADB:** `adb install -r terminator-survivors-quest2.apk`
            - **Where to find on Quest 2:** Open **App Library** -> filter dropdown (top-right) -> **Unknown Sources** -> **T-Survivors / Terminator Survivors 2029**.
            - **3D VR Launch:** Click **DEPLOY 3D VR** on the Title Screen to immediately enter stereoscopic 3D WebXR with full Quest Touch thumbstick & button controls.
          files: terminator-survivors-quest2.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
